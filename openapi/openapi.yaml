openapi: 3.1.0
info:
  description: External API endpoints for Artie
  title: Artie API
  version: v1.0.53
servers:
- url: https://api.artie.com
paths:
  /column-hashing-salts:
    get:
      description: Lists all column hashing salts for the authenticated company.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyColumnHashingSalt'
          description: OK
        "500":
          description: Internal Server Error
      summary: List column hashing salts
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Creates a new column hashing salt for the authenticated company.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateColumnHashingSaltRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateColumnHashingSaltResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /column-hashing-salts/{uuid}:
    delete:
      description: Deletes a column hashing salt by UUID.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: true
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
    get:
      description: Retrieves a column hashing salt by UUID, including the decrypted
        salt. Requires company admin.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSaltDetail'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Updates the name and description of a column hashing salt.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateColumnHashingSaltRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsColumnHashingSalt'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /column-hashing-salts/{uuid}/preview:
    post:
      description: Hashes a sample string value with this salt using the same function
        used by Artie's pipelines (HMAC-SHA256 keyed on the salt, or SHA-256 if the
        salt is empty). Returns the hex-encoded hash.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPreviewColumnHashingSaltRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPreviewColumnHashingSaltResponse'
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Preview a column hashing salt
      tags:
      - Column Hashing Salts
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
  /connectors:
    post:
      description: Creates a new source or destination connector for your Artie deployment.
        Configure database connections, authentication, and replication settings programmatically.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /connectors/{uuid}:
    delete:
      description: Permanently removes a connector and its associated configuration.
        This stops any active replication pipelines that depend on the connector.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: true
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
    get:
      description: Retrieves the full configuration and status of a connector by its
        unique identifier, including connection settings and current replication state.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Updates the configuration of an existing source or destination
        connector. Modify connection settings, credentials, or replication parameters
        for a running pipeline.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullConnector'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /connectors/{uuid}/detail:
    get:
      description: Returns detailed metadata for a specific table on the saved connector.
        Requires 'schemaName' and 'tableName' query parameters; 'isView' is optional.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorTableDetailResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch table detail for a saved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
        readOnlyHint: true
  /connectors/{uuid}/generate-shadow-script:
    post:
      description: Generates the SQL script to create shadow tables required for Oracle
        change data capture (CDC). Run this script on your Oracle source before starting
        replication.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorGenerateShadowScriptResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Generate Oracle shadow table script
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
  /connectors/{uuid}/postgres-drop-replication-slot:
    post:
      description: Drops a PostgreSQL replication slot that is inactive or orphaned.
        Use this to clean up stale replication slots that may be preventing WAL cleanup
        on the source.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorDropReplicationSlotRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Drop a PostgreSQL replication slot
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: true
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: false
  /connectors/{uuid}/start-dynamodb-export:
    post:
      description: Initiates a point-in-time export from Amazon DynamoDB for the specified
        connector. Use this to backfill your destination with existing DynamoDB table
        data.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorStartDynamoDBExportRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorStartDynamoDBExportResponse'
          description: OK
        "500":
          description: Internal Server Error
      summary: Start a DynamoDB export
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: false
  /connectors/databases:
    post:
      description: Lists available databases on the target using an unsaved connector
        configuration. Useful during connector setup to discover existing databases.
        Response metadata may include Iceberg S3 table bucket maintenance defaults.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsConnectorFetchDatabasesResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch databases for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
        readOnlyHint: true
  /connectors/new-database:
    post:
      description: Creates a new database on the target destination using a connector
        configuration that has not yet been saved. Useful during initial setup to
        prepare the destination.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateDatabaseRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a database on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: false
  /connectors/new-schema:
    post:
      description: Creates a new schema on the target destination using a connector
        configuration that has not yet been saved. Useful during initial setup to
        organize destination tables.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateSchemaRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a schema on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: false
  /connectors/new-snowflake-warehouse:
    post:
      description: Creates a new Snowflake virtual warehouse using an unsaved connector
        configuration. Useful during initial setup to provision compute resources
        for data replication.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorCreateSnowflakeWarehouseRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a Snowflake warehouse on an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: false
  /connectors/ping:
    post:
      description: Tests network connectivity and authentication for a connector configuration
        before saving it. Use this to validate connection settings during connector
        setup.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsConnectorPayload'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterConnectorPingResponse'
          description: OK
        "204":
          description: No Content
        "400":
          description: Bad Request
      summary: Ping a connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
        readOnlyHint: true
  /connectors/postgres-publications:
    post:
      description: Lists logical replication publications on a PostgreSQL source using
        an unsaved connector configuration. Useful during connector setup to let users
        select an existing publication.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorFetchPostgresPublicationsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyPostgresPublication'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: List PostgreSQL publications for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
        readOnlyHint: true
  /connectors/schemas:
    post:
      description: Lists available schemas in a specific database using an unsaved
        connector configuration. Useful during connector setup to discover existing
        schemas.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorFetchSchemasRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch schemas for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
        readOnlyHint: true
  /connectors/tables:
    post:
      description: Lists available tables in a specific database and schema using
        an unsaved connector configuration. Results are cached when a connector UUID
        is provided.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterConnectorFetchTablesRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyConnectorTable'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Fetch tables for an unsaved connector
      tags:
      - Connectors
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: true
        readOnlyHint: true
  /data-catalog/search:
    post:
      description: Searches across the company's data catalog using full-text search.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadsDataCatalogSearchRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyDataCatalogMatch'
          description: OK
        "500":
          description: Internal Server Error
      summary: Search the data catalog
      tags:
      - Data Catalog
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
  /encryption-keys:
    get:
      description: Lists all encryption keys for the authenticated company.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyEncryptionKey'
          description: OK
        "500":
          description: Internal Server Error
      summary: List encryption keys
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Creates a new encryption key for the authenticated company.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateEncryptionKeyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateEncryptionKeyResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /encryption-keys/{uuid}:
    delete:
      description: Deletes an encryption key by UUID.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Delete an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: true
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
    get:
      description: Retrieves an encryption key by UUID, including the decrypted key.
        Requires company admin.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsEncryptionKeyDetail'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Updates the name and description of an encryption key.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateEncryptionKeyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsEncryptionKey'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update an encryption key
      tags:
      - Encryption Keys
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /ingestion-api-keys:
    post:
      description: Creates a new ingestion API key for a source reader. Returns the
        key and its secret (only shown once).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterCreateIngestionAPIKeyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterCreateIngestionAPIKeyResponse'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create an ingestion API key
      tags:
      - Ingestion API Keys
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /ingestion-api-keys/{uuid}:
    delete:
      description: Deletes an ingestion API key by UUID.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
      summary: Delete an ingestion API key
      tags:
      - Ingestion API Keys
      x-artie-mcp:
        destructiveHint: true
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
    post:
      description: Updates an existing ingestion API key by UUID.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterUpdateIngestionAPIKeyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsIngestionAPIKey'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update an ingestion API key
      tags:
      - Ingestion API Keys
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /pipelines:
    get:
      description: Returns pipelines for the authenticated company, optionally filtered
        by environment.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponseBodyLightPipeline'
          description: OK
        "500":
          description: Internal Server Error
      summary: List pipelines
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Creates a new pipeline from a pipeline payload.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineCreateRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullPipeline'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Create a pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /pipelines/{uuid}:
    delete:
      description: Deletes a pipeline by UUID.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
      summary: Delete pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: true
        idempotentHint: false
        openWorldHint: true
        readOnlyHint: false
    get:
      description: Returns pipeline detail. With query includeRelatedObjects=true
        returns pipeline, sourceReader, sourceConnector, and optional destinationConnector;
        otherwise returns FullPipeline only.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      - in: query
        name: includeRelatedObjects
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouterPipelineDetailResponse'
          description: OK
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Get pipeline by UUID
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
        readOnlyHint: true
    post:
      description: Updates an existing pipeline by UUID.
      parameters:
      - in: path
        name: uuid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouterPipelineUpdateRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadsFullPipeline'
          description: OK
        "400":
          description: Bad Request
        "500":
          description: Internal Server Error
      summary: Update pipeline
      tags:
      - Pipelines
      x-artie-mcp:
        destructiveHint: false
        idempotentHint: false
        openWorldHint: false
        readOnlyHint: false
  /pipelines/{uuid}/backfill/cancel:
    post:
      description: Cancels backfilling for the given table UUIDs and/or history table
        UUIDs.
