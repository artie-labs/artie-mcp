name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-and-contract:
    name: quality-and-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          python-version: "3.14"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python -m scripts.download_policy_bundle
      - run: uv run python -m compileall -q server.py tests
      - run: uv run python -m unittest discover -s tests -v

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.6"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Build, start, and smoke-test image
        run: |
          set -euo pipefail
          container_name=artie-mcp-ci
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" || true
          }
          trap cleanup EXIT

          docker build --tag "artie-mcp:${GITHUB_SHA}" .
          docker run --detach --name "$container_name" \
            -e ARTIE_MCP_ALLOW_INSECURE_AUTH=true \
            -p 127.0.0.1::8000 "artie-mcp:${GITHUB_SHA}"
          port="$(docker port "$container_name" 8000/tcp | awk -F: '{print $NF}')"
          base_url="http://127.0.0.1:${port}"
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "$base_url/health" && curl --fail --silent --show-error "$base_url/ready"; then
              uv run --no-sync python tests/smoke_client.py --url "$base_url/mcp" --contract-path contract/policy.contract.json
              exit 0
            fi
            sleep 1
          done

          echo "container did not become healthy" >&2
          exit 1

  build-and-push:
    name: build-and-push
    needs: [quality-and-contract, container-smoke]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-mcp-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push MCP image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: |
            artielabs/artie-mcp:latest
            artielabs/artie-mcp:sha-${{ github.sha }}
