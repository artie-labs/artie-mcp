name: Feature request
description: A change to this MCP server or its public documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests here cover this repository. New Dashboard/API capabilities belong with Artie product, not as an unreviewed MCP tool.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing when using the hosted MCP integration?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change in this repository?
    validations:
      required: true
  - type: checkboxes
    id: hosted
    attributes:
      label: Confirmation
      options:
        - label: I understand self-hosting this server is not a supported Artie product.
          required: true
